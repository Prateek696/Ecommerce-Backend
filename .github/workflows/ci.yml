name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: ecommerce-backend/package-lock.json

    - name: Install dependencies
      working-directory: ./ecommerce-backend
      run: npm ci

    - name: Run linting
      working-directory: ./ecommerce-backend
      run: npm run lint

    - name: Run tests
      working-directory: ./ecommerce-backend
      run: npm test
      env:
        NODE_ENV: test
        MONGO_URI: mongodb://localhost:27017/ecommerce_test

    - name: Build application
      working-directory: ./ecommerce-backend
      run: npm run build

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: ecommerce-backend/package-lock.json

    - name: Install dependencies
      working-directory: ./ecommerce-backend
      run: npm ci

    - name: Run security audit
      working-directory: ./ecommerce-backend
      run: npm audit --audit-level moderate

    - name: Run Snyk security scan
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high
      continue-on-error: true
      if: ${{ secrets.SNYK_TOKEN }}

  docker-build:
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
      if: ${{ secrets.DOCKER_USERNAME }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./ecommerce-backend
        push: ${{ secrets.DOCKER_USERNAME }}
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/ecommerce-backend:latest
          ${{ secrets.DOCKER_USERNAME }}/ecommerce-backend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
