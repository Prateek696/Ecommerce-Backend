version: '3.8'

services:
  app:
    build: 
      context: ./ecommerce-backend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/ecommerce_dev
    depends_on:
      - mongo
    volumes:
      - ./ecommerce-backend:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - ecommerce-network
    command: npm run dev

  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=ecommerce_dev
    volumes:
      - mongo_dev_data:/data/db
    restart: unless-stopped
    networks:
      - ecommerce-network

volumes:
  mongo_dev_data:

networks:
  ecommerce-network:
    driver: bridge
